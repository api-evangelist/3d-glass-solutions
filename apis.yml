aid: 3d-glass-solutions
name: 3D Glass Solutions
description: '3D Glass Solutions (3DGS) is a US-based pure-play glass foundry in Albuquerque,
  New Mexico that manufactures photo-definable glass-ceramic substrates for advanced
  semiconductor packaging. Its patented APEX Glass material supports through-glass vias
  (TGV), high-density interconnect, integrated passive devices, RF substrates, micro-cavities
  and 3D heterogeneous integration for wireless communications, aerospace and defense,
  photonics, HPC/AI and sensor markets. The company sells wafer processing, custom fabrication
  and design-enablement services — including process design kits (PDKs) delivered through
  EDA partners such as the AWR software group — rather than software, and publishes no
  public API, SDK, developer portal or machine-readable specification.'
